<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allergy Guard</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --text: #f2f4f6; --muted: #a7b0ba; --line: #2b343e;
    --unsafe: #e5484d; --unsafe-bg: #3b1214; --confirm: #f5a524; --confirm-bg: #3a2a0c;
    --none: #8ea4bd; --none-bg: #1d2836; --chip: #26303b;
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --panel: #ffffff; --text: #14181d; --muted: #59636e; --line: #dfe3e8;
    --unsafe: #c7262c; --unsafe-bg: #fde8e8; --confirm: #a35f00; --confirm-bg: #fff3dc;
    --none: #3f5d7d; --none-bg: #e8eef5; --chip: #eef1f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 20px 24px 16px; }
  h1 { font-size: 26px; margin: 0 0 12px; font-weight: 650; }
  .banner { border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; display: flex; gap: 14px; align-items: center; }
  .banner .icon { font-size: 34px; line-height: 1; }
  .banner .label { font-size: 28px; font-weight: 750; letter-spacing: .2px; }
  .banner .sub { color: var(--muted); font-size: 16px; }
  .unsafe { background: var(--unsafe-bg); border: 2px solid var(--unsafe); } .unsafe .label { color: var(--unsafe); }
  .cannot_confirm { background: var(--confirm-bg); border: 2px solid var(--confirm); } .cannot_confirm .label { color: var(--confirm); }
  .no_listed_allergens { background: var(--none-bg); border: 2px solid var(--none); } .no_listed_allergens .label { color: var(--none); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .person { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .person:first-of-type { border-top: 0; }
  .person .name { font-weight: 650; font-size: 20px; }
  .person .why { color: var(--muted); font-size: 15px; }
  .pill { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; align-self: flex-start; }
  .pill.unsafe { color: var(--unsafe); border-width: 1px; } .pill.cannot_confirm { color: var(--confirm); border-width: 1px; } .pill.no_listed_allergens { color: var(--none); border-width: 1px; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 5px 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  li:first-child { border-top: 0; }
  .flagged { font-weight: 650; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 13px; color: var(--muted); }
  .chip.contains, .chip.may_contain { color: var(--unsafe); } .chip.possible { color: var(--confirm); }
  .swap .arrow { color: var(--muted); }
  button.choice { all: unset; cursor: pointer; display: block; width: 100%; padding: 12px 14px; margin-top: 8px; border-radius: 10px; background: var(--chip); font-size: 19px; }
  button.choice:focus-visible { outline: 3px solid var(--none); }
  .issues { color: var(--confirm); font-size: 15px; margin-top: 8px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 12px; display: flex; justify-content: space-between; gap: 12px; }
  footer a { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 20px; }
</style>
</head>
<body>
<main id="app"><div class="empty">Ask me to check a recipe or a product.</div></main>
<script>
(() => {
  const app = document.getElementById("app");
  const LABEL = { unsafe: "Avoid", cannot_confirm: "Can't confirm", no_listed_allergens: "None listed" };
  const SUB = {
    unsafe: "Contains, or may contain, an allergen for someone here.",
    cannot_confirm: "Data is missing or an ingredient can hide an allergen. Treat as unsafe.",
    no_listed_allergens: "Nothing listed for these allergies. Still check the label.",
  };
  const ICON = { unsafe: "⛔", cannot_confirm: "⚠️", no_listed_allergens: "🏷️" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // MCP Apps (2026-01-26) over postMessage: JSON-RPC between this view and its host.
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage(msg, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-input") app.innerHTML = `<div class="empty">Checking…</div>`;
    if (msg.method === "ui/notifications/tool-result") render(msg.params?.structuredContent);
    if (msg.method === "ui/notifications/host-context-changed") applyContext(msg.params);
  });

  function applyContext(ctx) {
    if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme;
  }

  function resize() {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }

  async function choose(barcode) {
    app.innerHTML = `<div class="empty">Checking…</div>`;
    try {
      const result = await request("tools/call", { name: "check_product", arguments: { barcode } });
      render(result?.structuredContent);
    } catch (e) {
      app.innerHTML = `<div class="empty">That didn't work. Ask me again by voice.</div>`;
    }
  }

  function render(v) {
    if (!v) return;
    const parts = [`<h1>${esc(v.title)}</h1>`];
    if (v.overall) {
      parts.push(`<div class="banner ${v.overall}" role="status"><span class="icon" aria-hidden="true">${ICON[v.overall]}</span><div><div class="label">${LABEL[v.overall]}</div><div class="sub">${SUB[v.overall]}</div></div></div>`);
    }
    const cards = [];
    if (v.people?.length && v.kind !== "shopping") {
      const rows = v.people.map((p) => {
        const right = v.overall
          ? `<span class="pill ${p.verdict}">${LABEL[p.verdict]}</span>`
          : `<span class="chip">${p.guest ? `guest${p.until ? ` · until ${esc(p.until)}` : ""}` : "household"}</span>`;
        const why = v.overall ? (p.reasons ?? []).slice(0, 3).map(esc).join("<br>") : esc((p.allergies ?? []).join(", "));
        return `<div class="person"><div><div class="name">${esc(p.name)}</div><div class="why">${why}</div></div>${right}</div>`;
      }).join("");
      cards.push(`<section class="card"><h2>${v.overall ? "Who's eating" : "Household"}</h2>${rows}</section>`);
    }
    if (v.items?.length) {
      const items = [...v.items].sort((a, b) => (b.flags?.length ? 1 : 0) - (a.flags?.length ? 1 : 0));
      const rows = items.map((i) => {
        const chips = dedupe(i.flags ?? []).map((f) => `<span class="chip ${f.kind}">${f.kind === "possible" ? "may hide " : f.kind === "may_contain" ? "may contain " : ""}${esc(f.allergen)}</span>`).join("");
        return `<li><span class="${i.flags?.length ? "flagged" : ""}">${esc(i.text)}</span>${chips}</li>`;
      }).join("");
      cards.push(`<section class="card"><h2>${v.kind === "product_check" ? "What I found" : "Ingredients"}</h2><ul>${rows}</ul></section>`);
    }
    if (v.swaps?.length) {
      const rows = v.swaps.map((s) => `<li class="swap"><span class="flagged">${esc(s.replace)}</span><span class="arrow">→</span><span>${s.options.map(esc).join(" · ")}</span><span class="chip">${esc(s.because)}</span></li>`).join("");
      cards.push(`<section class="card"><h2>Swaps</h2><ul>${rows}</ul></section>`);
    }
    if (v.candidates?.length) {
      const rows = v.candidates.map((c) => `<button class="choice" data-barcode="${esc(c.barcode)}">${esc(c.name)}${c.brand ? ` <span class="chip">${esc(c.brand)}</span>` : ""}</button>`).join("");
      cards.push(`<section class="card"><h2>Which one?</h2>${rows}</section>`);
    }
    if (v.shopping) {
      const rows = v.shopping.length ? v.shopping.map((s) => `<li>${esc(s.item)}${s.note ? `<span class="chip">${esc(s.note)}</span>` : ""}</li>`).join("") : `<li>Empty</li>`;
      cards.push(`<section class="card"><h2>Shopping list</h2><ul>${rows}</ul></section>`);
    }
    if (!v.overall && !cards.length) parts.push(`<div class="card">${esc(v.speech)}</div>`);
    parts.push(`<div class="grid">${cards.join("")}</div>`);
    if (v.dataIssues?.length) parts.push(`<div class="issues">${v.dataIssues.map(esc).join("<br>")}</div>`);
    const src = v.source ? (v.source.url ? `<a href="${esc(v.source.url)}" target="_blank" rel="noopener">${esc(v.source.label)}</a>` : esc(v.source.label)) : "";
    parts.push(`<footer><span>${esc(v.disclaimer)}</span><span>${src}</span></footer>`);
    app.innerHTML = parts.join("");
    app.querySelectorAll("button.choice").forEach((b) => b.addEventListener("click", () => choose(b.dataset.barcode)));
    resize();
  }

  function dedupe(flags) {
    const seen = new Set();
    return flags.filter((f) => { const k = f.allergen + f.kind; return seen.has(k) ? false : (seen.add(k), true); });
  }

  request("ui/initialize", {
    appInfo: { name: "allergy-guard-screen", version: "0.1.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then((result) => {
    applyContext(result?.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => {});
})();
</script>
</body>
</html>
