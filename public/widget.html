<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allergy Crosscheck</title>
<style>
  /* Authored at the Alexa+ MCP design guide's 768x480 base canvas, with its type, spacing and corner-radius
     tokens. One root scale is applied (zoom on <html>), derived from hostContext maxWidth/maxHeight only (deviceClass
     is not read), so nothing below is sized per device. Layout uses no viewport-width breakpoints except the phone fallback:
     under zoom a media query still sees the host's pixels. */
  :root {
    --t-display2: 40px; --t-display3: 32px; --t-display4: 28px; --t-display5: 24px; --t-headline1: 20px; --t-headline2: 18px; --t-body1: 16px; --t-body2: 14px;
    --s-4xs: 2px; --s-2xs: 6px; --s-xs: 8px; --s-sm: 12px; --s-md: 16px;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --face-display: "Helvetica Neue", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
    --face-text: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
    --stock: #1a1a1a; --ink: #f5f5f5; --ink-2: #b3b3b3; --rule: #6e6e6e; --hair: #3d3d3d;
    --unsafe: #ff7a7e; --confirm: #f5a524; --none: #8ea4bd;
  }
  :root[data-theme="light"] {
    --stock: #ffffff; --ink: #000000; --ink-2: #4d4d4d; --rule: #000000; --hair: #b8b8b8;
    --unsafe: #c7262c; --confirm: #8a4f00; --none: #3f5d7d;
  }
  .unsafe { --v: var(--unsafe); } .cannot_confirm { --v: var(--confirm); } .no_listed_allergens { --v: var(--none); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--stock); color: var(--ink); font: var(--t-body1)/1.3 var(--face-text); }
  main { padding: calc(var(--s-sm) + var(--inset-top, 0px)) calc(var(--s-md) + var(--inset-right, 0px)) calc(var(--s-xs) + var(--inset-bottom, 0px)) calc(var(--s-md) + var(--inset-left, 0px)); }
  h1, h2, .banner .label, .person .name, .pill, .empty { font-family: var(--face-display); font-stretch: condensed; }
  main > h1 { font-size: var(--t-display4); line-height: 1.15; margin: 0 0 var(--s-xs); padding-bottom: var(--s-4xs); font-weight: 900; border-bottom: 10px solid var(--rule); }
  .banner { display: flex; gap: var(--s-sm); align-items: center; padding: 0 0 var(--s-xs); margin-bottom: var(--s-xs); border-bottom: 10px solid var(--v); }
  .banner .icon { width: 32px; height: 32px; flex: none; color: var(--v); }
  .banner .icon svg { display: block; width: 100%; height: 100%; }
  .banner .label { font-size: var(--t-display2); line-height: 1.05; font-weight: 900; white-space: nowrap; color: var(--v); }
  .banner .ctx { flex: 1; min-width: 0; }
  .banner h1 { font-size: var(--t-headline1); line-height: 1.2; margin: 0; font-weight: 800; }
  .banner .sub { color: var(--ink-2); font-size: var(--t-body2); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-xs); align-items: start; }
  .grid.one { grid-template-columns: minmax(0, 1fr); }
  .grid.one .person .name { font-size: var(--t-display5); }
  .grid.one .person .why, .grid.one li { font-size: var(--t-headline2); }
  .grid.one .chip { font-size: var(--t-body1); }
  .grid.one button.choice { font-size: var(--t-headline1); }
  .grid.recipe { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); grid-template-areas: "who swaps" "watch swaps"; }
  .grid.recipe .who { grid-area: who; } .grid.recipe .watch { grid-area: watch; } .grid.recipe .swaps { grid-area: swaps; }
  @media (max-width: 560px) { .banner { flex-wrap: wrap; } .banner .ctx { flex-basis: 100%; } }
  @media (max-width: 560px) { .grid, .grid.recipe { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; } .grid.recipe > * { grid-area: auto; } }
  .card { border: 2px solid var(--rule); border-radius: var(--r-sm); padding: calc(var(--s-xs) - 1px) calc(var(--s-sm) - 1px); }
  .card.picks { border: 0; padding: 0; }
  .card h2 { font-size: var(--t-headline2); line-height: 1; font-weight: 800; margin: 0; padding-bottom: var(--s-4xs); border-bottom: 3px solid var(--rule); }
  .person { display: grid; grid-template-columns: 1fr auto; column-gap: var(--s-xs); align-items: start; padding: var(--s-2xs) 0; border-top: 1px solid var(--hair); }
  .person .why { grid-column: 1 / -1; }
  .person:first-of-type { border-top: 0; }
  .person .name { font-weight: 800; font-size: var(--t-headline1); }
  .pill { font-size: var(--t-body1); line-height: 1.3; font-weight: 800; border-radius: var(--r-xs); padding: var(--s-4xs) var(--s-xs); white-space: nowrap; align-self: flex-start; }
  .pill.unsafe, .pill.cannot_confirm { background: var(--v); color: var(--stock); }
  .pill.no_listed_allergens { color: var(--v); box-shadow: inset 0 0 0 2px var(--v); }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: var(--s-2xs) 0; border-top: 1px solid var(--hair); display: flex; flex-wrap: wrap; gap: var(--s-4xs) var(--s-2xs); align-items: baseline; }
  li:first-child { border-top: 0; }
  .chip { font-size: var(--t-body2); color: var(--ink-2); }
  .chip.contains, .chip.may_contain, .chip.possible, .chip.unknown { color: var(--ink); font-size: var(--t-body1); }
  .chip b { font-weight: 800; }
  .chip.contains::before, .chip.may_contain::before, .chip.possible::before, .chip.unknown::before { content: "("; }
  .chip.contains::after, .chip.may_contain::after, .chip.possible::after, .chip.unknown::after { content: ")"; }
  .swap .arrow { color: var(--ink-2); }
  button.choice { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; min-height: 48px; padding: calc(var(--s-sm) - 2px) calc(var(--s-md) - 2px); margin-top: var(--s-xs); border: 2px solid var(--rule); border-radius: var(--r-sm); font-size: var(--t-body1); }
  button.choice:first-of-type { margin-top: 0; }
  button.choice:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .issues { color: var(--confirm); font-size: var(--t-body2); margin-top: var(--s-xs); }
  footer { color: var(--ink-2); font-size: var(--t-body2); margin-top: var(--s-xs); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--s-sm); }
  .more { color: var(--ink-2); font-size: var(--t-body2); }
  .empty { color: var(--ink-2); padding: 40px 0; text-align: center; font-size: var(--t-display5); font-weight: 800; }
</style>
</head>
<body>
<main id="app"><div class="empty">Ask me to check a recipe or a product.</div></main>
<script>
(() => {
  const app = document.getElementById("app");
  const LABEL = { unsafe: "Avoid", cannot_confirm: "Can't confirm", no_listed_allergens: "None listed" };
  const SUB = {
    unsafe: "Contains, or may contain, an allergen for someone here.",
    cannot_confirm: "Data is missing, or an ingredient isn't recognised or can hide an allergen. Treat as unsafe.",
    no_listed_allergens: "Nothing listed for these allergies. Still check the label.",
  };
  const ICON = {
    unsafe: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.4 1h9.2L23 7.4v9.2L16.6 23H7.4L1 16.6V7.4z"/><path d="M6.5 12h11" style="stroke:var(--stock)" stroke-width="3.2"/></svg>',
    cannot_confirm: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5 23.5 22H.5z"/><path d="M12 8.5v6.5M12 18.4v.1" style="stroke:var(--stock)" stroke-width="2.8" stroke-linecap="round"/></svg>',
    no_listed_allergens: '<svg viewBox="0 0 24 24"><path d="M2.5 3.5h9l10 10-8 8-11-11z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="7.5" cy="8.5" r="2" fill="currentColor"/></svg>',
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // MCP Apps (2026-01-26) over postMessage: JSON-RPC between this view and its host.
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage(msg, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-input") app.innerHTML = `<div class="empty">Checking…</div>`;
    if (msg.method === "ui/notifications/tool-result") render(msg.params?.structuredContent);
    if (msg.method === "ui/notifications/host-context-changed") applyContext(msg.params);
    if (msg.method === "ui/resource-teardown" && msg.id !== undefined) post({ jsonrpc: "2.0", id: msg.id, result: {} });
  });

  // Host context: theme, safe-area insets, and the one root scale. The UI is authored at the 768x480 base
  // canvas; the scale is the host's canvas over that, min(maxWidth/768, maxHeight/480): 1.667 on an Echo
  // Show 8 or 15 (1280x800), 1 when the host sends no size. It never goes below 1, so a phone-sized host
  // keeps readable text and gets the one-column layout instead of a shrunken canvas.
  const BASE = { width: 768, height: 480 };
  let host = {};
  const rootScale = ({ maxWidth, maxHeight }) =>
    maxWidth > 0 && maxHeight > 0 ? Math.max(1, Math.min(maxWidth / BASE.width, maxHeight / BASE.height)) : 1;

  function applyContext(ctx) {
    if (!ctx) return;
    host = { ...host, ...ctx }; // host-context-changed may carry only what changed
    const root = document.documentElement;
    if (host.theme) root.dataset.theme = host.theme;
    const zoom = rootScale(host);
    root.style.zoom = zoom === 1 ? "" : String(zoom);
    // The host measures insets in its own pixels; the zoom would scale them a second time.
    for (const side of ["top", "right", "bottom", "left"]) {
      if (typeof host.safeAreaInsets?.[side] === "number") root.style.setProperty(`--inset-${side}`, `${host.safeAreaInsets[side] / zoom}px`);
    }
    resize();
  }

  // Tell the host how big the content is, in the host's own pixels.
  function resize() {
    const box = document.getElementById("app").getBoundingClientRect(); // already in the host's pixels under the root zoom
    notify("ui/notifications/size-changed", { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }

  async function choose(barcode, forNames) {
    app.innerHTML = `<div class="empty">Checking…</div>`;
    try {
      const result = await request("tools/call", { name: "check_product", arguments: forNames?.length ? { barcode, for: forNames } : { barcode } });
      render(result?.structuredContent);
    } catch (e) {
      app.innerHTML = `<div class="empty">That didn't work. Ask me again by voice.</div>`;
    }
  }

  function render(v) {
    if (!v) return;
    const parts = v.overall
      ? [`<div class="banner ${v.overall}" role="status"><span class="icon" aria-hidden="true">${ICON[v.overall]}</span><span class="label">${LABEL[v.overall]}</span><div class="ctx"><h1>${esc(v.title)}</h1><div class="sub">${SUB[v.overall]}</div></div></div>`]
      : [`<h1>${esc(v.title)}</h1>`];
    const cards = [];
    if (v.people?.length && v.kind !== "shopping") {
      const rows = v.people.map((p) => {
        const right = v.overall
          ? `<span class="pill ${p.verdict}">${LABEL[p.verdict]}</span>`
          : `<span class="chip">${p.guest ? `guest${p.until ? ` · ${p.expired ? "ended" : "until"} ${esc(day(p.until))}` : ""}` : "household"}</span>`;
        // On a recipe the "Watch out for" card names the ingredients, so a person's row keeps only the allergen.
        const reasons = v.kind === "recipe_check" ? (p.reasons ?? []).map((r) => r.split(":")[0]) : p.reasons ?? [];
        const why = v.overall ? [...new Set(reasons)].map(esc).join(v.kind === "recipe_check" ? ", " : "<br>") : esc((p.allergies ?? []).join(", "));
        return `<div class="person"><div class="name">${esc(p.name)}</div>${right}<div class="why">${why}</div></div>`;
      }).join("");
      cards.push(`<section class="card who">${v.overall ? "<h2>Who's eating</h2>" : ""}${rows}</section>`);
    }
    if (v.items?.length) {
      // A check shows the flagged lines and summarises the rest, with a cap of eight lines; a plain
      // recipe shows its first eight.
      const flagged = v.items.filter((i) => i.flags?.length);
      const shown = v.overall ? flagged : v.items.slice(0, 8);
      const rest = v.items.length - shown.length;
      const rows = shown.map((i) => {
        // One chip per kind ("may hide Peanuts, Milk"), so a row's flags take one line.
        const byKind = new Map();
        for (const f of dedupe(i.flags ?? [])) byKind.set(f.kind, [...(byKind.get(f.kind) ?? []), f.allergen]);
        const chips = [...byKind].map(([kind, names]) => `<span class="chip ${kind}">${kind === "possible" ? "may hide " : kind === "may_contain" ? "may contain " : ""}<b>${names.map(esc).join(", ")}</b></span>`).join("");
        return `<li><span class="${i.flags?.length ? "flagged" : ""}">${esc(i.text)}</span>${chips}</li>`;
      });
      if (rest > 0) rows.push(`<li class="more">${v.overall ? `${shown.length ? "+ " : ""}${rest} ${shown.length ? "other " : ""}ingredient${rest === 1 ? "" : "s"}: nothing listed for these allergies` : `and ${rest} more`}</li>`);
      const heading = v.kind === "product_check" ? "What I found" : v.overall ? "Watch out for" : "Ingredients";
      cards.push(`<section class="card watch"><h2>${heading}</h2><ul>${rows.join("")}</ul></section>`);
    }
    if (v.swaps?.length) {
      const rows = v.swaps.map((s) => `<li class="swap"><span class="flagged">${esc(s.replace)}</span><span class="arrow">→</span><span>${s.options.map(esc).join(" · ")}</span><span class="chip">${esc(s.because)}</span></li>`).join("");
      cards.push(`<section class="card swaps"><h2>Swaps</h2><ul>${rows}</ul></section>`);
    }
    if (v.candidates?.length) {
      const rows = v.candidates.map((c) => `<button class="choice" data-barcode="${esc(c.barcode)}">${esc(c.name)}${c.brand ? ` <span class="chip">${esc(c.brand)}</span>` : ""}</button>`).join("");
      cards.push(`<section class="card picks">${rows}</section>`);
    }
    if (v.shopping) {
      // Shows at most eight lines, then "and N more".
      const rows = v.shopping.length ? v.shopping.slice(0, 8).map((s) => `<li>${esc(s.item)}${s.note ? `<span class="chip">${esc(s.note)}</span>` : ""}</li>`).join("") + (v.shopping.length > 8 ? `<li class="more">and ${v.shopping.length - 8} more</li>` : "") : `<li>Empty</li>`;
      cards.push(`<section class="card"><ul>${rows}</ul></section>`);
    }
    if (!v.overall && !cards.length) parts.push(`<div class="card">${esc(v.speech)}</div>`);
    parts.push(`<div class="grid${cards.length === 3 && v.swaps?.length ? " recipe" : cards.length === 1 ? " one" : ""}">${cards.join("")}</div>`);
    // Data issues already shown on every person's row aren't repeated underneath.
    const issues = (v.dataIssues ?? []).filter((d) => !(v.people?.length && v.people.every((p) => (p.reasons ?? []).includes(d))));
    if (issues.length) parts.push(`<div class="issues">${issues.map(esc).join("<br>")}</div>`);
    const src = v.source ? `Data: ${esc(v.source.label)}` : "";
    parts.push(`<footer><span>${esc(v.disclaimer)}</span><span>${src}</span></footer>`);
    app.innerHTML = parts.join("");
    app.querySelectorAll("button.choice").forEach((b) => b.addEventListener("click", () => choose(b.dataset.barcode, v.for)));
    resize();
  }

  const day = (iso) => { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };

  function dedupe(flags) {
    const seen = new Set();
    return flags.filter((f) => { const k = f.allergen + f.kind; return seen.has(k) ? false : (seen.add(k), true); });
  }

  new ResizeObserver(resize).observe(document.documentElement);

  request("ui/initialize", {
    appInfo: { name: "allergy-crosscheck-screen", version: "0.1.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then((result) => {
    applyContext(result?.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => {});
})();
</script>
</body>
</html>
