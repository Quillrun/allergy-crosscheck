<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allergy Crosscheck · Scan</title>
<style>
  :root { --bg: #0a0d11; --panel: #141a21; --line: #232b34; --text: #eef1f4; --muted: #95a0ab; --accent: #59d6ff; --ok: #b7f0c9; --bad: #ff7a7e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  .sub { color: var(--muted); margin: 0; }
  .cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; border: 1px solid var(--line); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .aim { position: absolute; left: 10%; right: 10%; top: 38%; height: 24%; border: 3px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 9999px #0007; transition: border-color .2s; }
  .cam.hit .aim { border-color: var(--ok); }
  .cam .msg { position: absolute; inset: auto 0 0 0; padding: 12px 16px; background: #000a; color: var(--muted); font-size: 15px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
  .card[hidden] { display: none; }
  .found .label { color: var(--muted); font-size: 15px; }
  .found .name { font-size: 24px; font-weight: 700; margin: 2px 0 4px; }
  .found .code { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
  .found .ask { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #0f2a36; color: #d8f4ff; }
  .err { color: var(--bad); }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-height: 48px; font-size: 18px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #0f1419; color: var(--text); }
  button { min-height: 48px; padding: 0 18px; font-size: 17px; font-weight: 600; border-radius: 12px; border: 0; background: var(--accent); color: #04121a; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .foot { color: var(--muted); font-size: 14px; margin-top: auto; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Scan a product</h1>
    <p class="sub">Point the camera at the barcode. Then ask Alexa about it.</p>
  </div>
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="aim"></div>
    <div class="msg" id="msg">Starting the camera…</div>
  </div>
  <div class="card found" id="found" hidden aria-live="polite">
    <div class="label">Scanned</div>
    <div class="name" id="name"></div>
    <div class="code" id="code"></div>
    <div class="ask" id="ask">Now ask Alexa: “Can we have what I just scanned?”</div>
  </div>
  <div class="card err" id="error" hidden aria-live="assertive"></div>
  <form id="manual" autocomplete="off">
    <input id="digits" inputmode="numeric" pattern="[0-9 ]*" placeholder="Or type the barcode digits" aria-label="Barcode digits">
    <button type="submit">Send</button>
  </form>
  <button class="ghost" id="again" hidden>Scan another</button>
  <p class="foot">Allergy Crosscheck reads ingredient data that can be wrong or out of date. Always check the label.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const video = $("video"), msg = $("msg"), cam = $("cam");
  const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e"];
  // SCAN_TOKEN: the phone opens /scan#token=..., and the fragment never reaches a server log.
  const TOKEN = new URLSearchParams(location.hash.slice(1)).get("token");
  let detector, scanning = false, last = "", streak = 0, failures = 0;
  const MAX_FAILURES = 10; // detect() errors in a row, 150 ms apart, before the scanner gives up

  async function getDetector() {
    if ("BarcodeDetector" in window) {
      const supported = await BarcodeDetector.getSupportedFormats();
      if (FORMATS.some((f) => supported.includes(f))) return new BarcodeDetector({ formats: FORMATS.filter((f) => supported.includes(f)) });
    }
    // Safari and others: the same API, decoded in WebAssembly, served by this server.
    await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = "/vendor/barcode-detector.js"; s.onload = ok; s.onerror = fail; document.head.append(s); });
    BarcodeDetectionAPI.setZXingModuleOverrides({ locateFile: (path) => `/vendor/${path}` });
    return new BarcodeDetectionAPI.BarcodeDetector({ formats: FORMATS });
  }

  async function start() {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      msg.textContent = "The camera needs a secure (https) page. Type the digits below instead.";
      return;
    }
    try {
      detector ??= await getDetector();
      video.srcObject ??= await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
      await video.play();
      msg.textContent = "Looking for a barcode…";
      scanning = true;
      failures = 0;
      loop();
    } catch (err) {
      msg.textContent = "I couldn't open the camera. Type the digits below instead.";
    }
  }

  async function loop() {
    if (!scanning) return;
    try {
      const codes = video.readyState >= 2 ? await detector.detect(video) : [];
      failures = 0;
      const code = codes.find((c) => /^\d{8,14}$/.test(c.rawValue))?.rawValue;
      // Two matching reads in a row before sending: one blurry frame can misread a digit.
      streak = code && code === last ? streak + 1 : code ? 1 : 0;
      last = code || "";
      if (streak >= 2) { scanning = false; cam.classList.add("hit"); navigator.vibrate?.(60); return send(code); }
    } catch (err) {
      // A decoder that fails to load (Safari's WebAssembly loads on the first detect) fails every time: say so instead of looking for ever.
      if (++failures >= MAX_FAILURES) {
        scanning = false;
        console.error("Barcode decoder failed", err);
        msg.textContent = "I can't read barcodes on this device. Type the digits below instead.";
        return;
      }
    }
    setTimeout(loop, 150);
  }

  const NOT_SAVED = "Not saved. Tap Scan another, or type the digits.";

  function fail(text) {
    $("found").hidden = true; // never leave the last product's card under an error
    $("error").textContent = text;
    $("error").hidden = false;
    msg.textContent = "Not saved.";
  }

  async function send(barcode) {
    $("error").hidden = true;
    $("found").hidden = true;
    msg.textContent = "Got it. Looking it up…";
    try {
      const res = await fetch("/scan", { method: "POST", headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {}) }, body: JSON.stringify({ barcode }) });
      let body;
      try { body = await res.json(); } catch {}
      if (!res.ok || !body?.barcode) {
        // Only text the server wrote is shown; a parser's or the network's message is not for the person holding the phone.
        if (res.status === 401) return fail("This page isn't allowed to save scans. Open the scan link again.");
        return fail(!res.ok && typeof body?.error === "string" ? body.error : NOT_SAVED);
      }
      $("name").textContent = body.name || "A product without a name in the data";
      $("code").textContent = body.barcode;
      if (body.ask) $("ask").textContent = `Now ask Alexa: “${body.ask}”`;
      $("found").hidden = false;
      msg.textContent = "Saved. Now ask Alexa.";
    } catch (err) {
      console.error("Scan not saved", err);
      fail(NOT_SAVED);
    } finally {
      $("again").hidden = false;
    }
  }

  $("manual").addEventListener("submit", (e) => { e.preventDefault(); const d = $("digits").value.replace(/\D/g, ""); if (d) { scanning = false; send(d); } });
  $("again").addEventListener("click", () => { $("found").hidden = true; $("error").hidden = true; $("again").hidden = true; cam.classList.remove("hit"); last = ""; streak = 0; start(); });
  start();
</script>
</body>
</html>
